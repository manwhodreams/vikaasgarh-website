<header class="header">

    <div class="header-container">

        <!-- ========================================
             Main Header Logo
        ======================================== -->

        <div class="header-logo">

            <a
                href="/"
                aria-label="VikaasGarh Home"
            >
                <img
                    src="/assets/images/logos/vikaasgarh/VikaasGarh Original Multicolor Logo with White Background.png"
                    alt="VikaasGarh"
                >
            </a>

        </div>


        <!-- ========================================
             Navigation / Fullscreen Responsive Menu
        ======================================== -->

        <div
            class="header-actions"
            id="site-mobile-menu"
        >

            <!-- ========================================
                 Fullscreen Menu Header
                 Responsive Screens Only
            ======================================== -->

            <div class="mobile-menu-header">

                <a
                    class="mobile-menu-logo"
                    href="/"
                    aria-label="VikaasGarh Home"
                >
                    <img
                        src="/assets/images/logos/vikaasgarh/VikaasGarh Original Multicolor Logo with White Background.png"
                        alt="VikaasGarh"
                    >
                </a>


                <button
                    class="mobile-menu-close"
                    type="button"
                    aria-label="Close navigation menu"
                ></button>

            </div>


            <!-- ========================================
                 Main Navigation
            ======================================== -->

            <nav
                class="header-navigation"
                aria-label="Main navigation"
            >

                <a
                    href="/"
                    data-en="Home"
                    data-hi=""
                >
                    Home
                </a>

                <a
                    href="/about/"
                    data-en="About"
                    data-hi=""
                >
                    About
                </a>

                <a
                    href="/academy/"
                    data-en="Academy"
                    data-hi=""
                >
                    Academy
                </a>

                <a
                    href="/incubator/"
                    data-en="Incubator"
                    data-hi=""
                >
                    Incubator
                </a>

                <a
                    href="/accelerator/"
                    data-en="Accelerator"
                    data-hi=""
                >
                    Accelerator
                </a>

                <a
                    href="/opportunities/"
                    data-en="Opportunities"
                    data-hi=""
                >
                    Opportunities
                </a>

                <a
                    href="/resources/"
                    data-en="Resources"
                    data-hi=""
                >
                    Resources
                </a>

                <a
                    href="/contact/"
                    data-en="Contact"
                    data-hi=""
                >
                    Contact
                </a>

            </nav>

        </div>


        <!-- ========================================
             Header Controls
             Language + Hamburger
        ======================================== -->

        <div class="header-controls">

            <!-- Language Selector -->

            <div
                class="language-switcher"
                role="group"
                aria-label="Language selector"
            >

                <button
                    type="button"
                    data-language="en"
                    aria-pressed="true"
                >
                    EN
                </button>

                <button
                    type="button"
                    data-language="hi"
                    lang="hi"
                    aria-pressed="false"
                >
                    हिंदी
                </button>

            </div>


            <!-- Responsive Hamburger -->

            <button
                class="mobile-menu-toggle"
                type="button"
                aria-label="Open navigation menu"
                aria-controls="site-mobile-menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </div>

</header>
