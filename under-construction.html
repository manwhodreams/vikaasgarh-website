<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <title>Under Construction | VikaasGarh</title>


    <!-- ========================================
         Inter Font
    ========================================= -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ========================================
         Font Awesome
    ========================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- ========================================
         Global CSS
    ========================================= -->

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

</head>


<body>


    <!-- ========================================
         Utility Bar
    ========================================= -->

    <div id="utility-bar"></div>


    <!-- ========================================
         Header
    ========================================= -->

    <div id="header"></div>


    <!-- ========================================
         Main
    ========================================= -->

    <main>


        <!-- ========================================
             Under Construction Page
        ========================================= -->

        <section class="construction-page">

            <div class="construction-page-container">


                <h1 class="construction-page-heading">
                    Under Construction
                </h1>


                <div
                    class="construction-page-accent"
                    aria-hidden="true"
                ></div>


                <p class="construction-page-description">
                    We're working on this page. Please check back soon.
                </p>


                <a
                    href="/"
                    class="btn btn--primary construction-page-cta"
                >
                    <span>
                        Go to Homepage
                    </span>

                    <i
                        class="fa-solid fa-arrow-right"
                        aria-hidden="true"
                    ></i>
                </a>


            </div>

        </section>


    </main>


    <!-- ========================================
         Footer
    ========================================= -->

    <div id="footer"></div>


    <!-- ========================================
         Global JavaScript
    ========================================= -->

    <script src="/js/global.js"></script>


</body>

</html>
